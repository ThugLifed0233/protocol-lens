[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "protocol-lens"
version = "0.3.0"
description = "A local, Apple-first personal health timeline and correlation explorer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mrinmay Date" }]
dependencies = [
  "duckdb>=1.2,<2",
  "openpyxl>=3.1,<4",
  "pandas>=2.2,<3",
  "plotly>=6,<7",
  "requests>=2.32,<3",
  "streamlit>=1.46,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
protocol-lens = "protocol_lens.cli:main"
protocol-lens-app = "protocol_lens.launcher:main"

[tool.hatch.build.targets.wheel]
packages = ["src/protocol_lens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
